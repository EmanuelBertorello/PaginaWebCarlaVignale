<!-- src/app/comps/cv/cv.html -->
<section class="cv">
  <div class="cv__wrap">
    <div class="cv__card">
      <!-- Texto -->
      <div class="cv__content">
        <p class="cv__eyebrow">Productores de Seguros</p>

        <h2 class="cv__title">
          Sumate a nuestra red de productores de seguros
        </h2>

        <p class="cv__text">
          Adjuntá tu CV en PDF y lo recibiremos directamente por correo para
          tenerte en cuenta en futuras oportunidades.
        </p>

        <a
          class="cv__btn"
          [href]="waHref"
          target="_blank"
          rel="noopener"
        >
          Sumate a la red
        </a>
      </div>

      <!-- Imagen -->
      <div class="cv__media">
        <img
          [src]="imgUrl"
          alt="Profesionales de seguros trabajando juntos"
        />
      </div>
    </div>
  </div>
</section>
