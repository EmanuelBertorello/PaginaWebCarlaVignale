<section class="kpi-band" aria-label="Estadísticas clave">
  <div class="kpi-band__wrap">

    <article class="kpi-card" *ngFor="let k of kpis">
      <span class="kpi-card__num">{{ k.value }}</span>
      <span class="kpi-card__label">{{ k.label }}</span>
      <span class="kpi-card__note" *ngIf="k.note">{{ k.note }}</span>
    </article>

  </div>
</section>
